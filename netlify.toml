[build]
  command = "npm run build"
  publish = "dist"

# 🔥 IMPORTANT FIX (this fixes your click issue)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer-when-downgrade"

# Cache static 3D models
[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache textures
[[headers]]
  for = "/textures/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

# Cache CSS
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"